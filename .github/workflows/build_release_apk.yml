name: Build release APK

on:
  workflow_dispatch:
  push:
    branches:
      - jarvis-os-lawnchair-15

jobs:
  build-release-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-encryption-key: Da25KUVSE5jbGds2zXmfXw==
      - name: Configure stable release signing
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Stable release signing is not configured. Add KEYSTORE (base64), KEYSTORE_PASSWORD, KEY_ALIAS, and KEY_PASSWORD repository secrets. Refusing to create an APK with a temporary debug key that cannot reliably update an existing installation."
            exit 1
          fi

          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$GITHUB_WORKSPACE/key.jks"
          {
            printf 'storePassword=%s\n' "$KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
            printf 'storeFile=%s\n' "$GITHUB_WORKSPACE/key.jks"
          } > keystore.properties
      - name: Build release APK
        run: ./gradlew assembleLawnWithQuickstepGithubRelease bundleLawnWithQuickstepPlayRelease
      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: Release APK
          path: build/outputs/*
