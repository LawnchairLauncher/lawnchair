name: Build release APK

on:
  workflow_dispatch:
  push:
    branches:
      - jarvis-os-lawnchair-15

jobs:
  build-release-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-encryption-key: Da25KUVSE5jbGds2zXmfXw==
      - name: Restore persistent NIX OS signing key
        env:
          NIXOS_KEYSTORE_B64: ${{ secrets.KEYSTORE }}
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/nixos-release.jks
        run: |
          test -n "$NIXOS_KEYSTORE_B64" || { echo "Missing KEYSTORE secret"; exit 1; }
          printf '%s' "$NIXOS_KEYSTORE_B64" | base64 --decode > "$RELEASE_KEYSTORE_PATH"
          test -s "$RELEASE_KEYSTORE_PATH"
          chmod 600 "$RELEASE_KEYSTORE_PATH"
      - name: Build signed release APK
        env:
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/nixos-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_PASSWORD" || { echo "Missing KEYSTORE_PASSWORD secret"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "Missing KEY_ALIAS secret"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "Missing KEY_PASSWORD secret"; exit 1; }
          ./gradlew assembleLawnWithQuickstepGithubRelease
      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: NIX-OS-v1.3-Beta-Hotfix
          path: build/outputs/apk/**/*.apk
