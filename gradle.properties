kotlin.code.style=official

org.gradle.caching=true
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.parallel=true
org.gradle.tooling.parallel=true

# KSP incremental processing relativises dependency paths against the project
# directory. When the Gradle cache (C:) and the project (D:) sit on different
# Windows drives that is impossible, and KSP fails with "this and base files
# have different roots". Full processing sidesteps it.
ksp.incremental=false
